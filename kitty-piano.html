<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kitty 弹钢琴</title>
<style>
  :root {
    --bg: #fdeef4;
    --text: #6b3a52;
    --btn: #ff6f9c;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 12px;
    padding: 16px;
    background: var(--bg);
    font-family: "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
    color: var(--text);
  }
  svg { width: 100%; max-width: 820px; height: auto; display: block; }
  button {
    border: none;
    border-radius: 999px;
    padding: 10px 22px;
    font-size: 16px;
    color: #fff;
    background: var(--btn);
    cursor: pointer;
    box-shadow: 0 4px 0 #d94f7c;
  }
  button:active { transform: translateY(2px); box-shadow: 0 2px 0 #d94f7c; }

  /* ---------- SVG 动画 ---------- */
  .head { transform-origin: 400px 300px; animation: bob 0.9s ease-in-out infinite alternate; }
  @keyframes bob { from { transform: rotate(-3deg); } to { transform: rotate(3deg); } }

  .eye { transform-box: fill-box; transform-origin: center; animation: blink 4s infinite; }
  @keyframes blink { 0%, 92%, 100% { transform: scaleY(1); } 95% { transform: scaleY(0.1); } }

  .bow { transform-origin: 470px 132px; animation: wiggle 0.45s ease-in-out infinite alternate; }
  @keyframes wiggle { from { transform: rotate(-5deg); } to { transform: rotate(5deg); } }

  .tail { transform-origin: 470px 370px; animation: swish 1.8s ease-in-out infinite alternate; }
  @keyframes swish { from { transform: rotate(-12deg); } to { transform: rotate(10deg); } }

  .body { transform-origin: 400px 390px; animation: sway 1.8s ease-in-out infinite alternate; }
  @keyframes sway { from { transform: rotate(-1.5deg); } to { transform: rotate(1.5deg); } }

  .sparkle { transform-box: fill-box; transform-origin: center; animation: twinkle 2s ease-in-out infinite; }
  @keyframes twinkle { 0%, 100% { opacity: .2; transform: scale(.6); } 50% { opacity: 1; transform: scale(1); } }

  .note { animation: floatUp 2.4s ease-out forwards; }
  @keyframes floatUp {
    0%   { opacity: 0; transform: translate(0, 0) scale(.6); }
    15%  { opacity: 1; }
    100% { opacity: 0; transform: translate(var(--dx), -190px) scale(1.2) rotate(var(--rot)); }
  }
</style>
</head>
<body>

<svg id="stage" viewBox="0 0 800 600" role="img" aria-label="白色小猫戴着红色蝴蝶结弹钢琴的动画">
  <defs>
    <linearGradient id="wall" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffe3ee"/>
      <stop offset="1" stop-color="#ffd0e1"/>
    </linearGradient>
    <linearGradient id="lacquer" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3a2a33"/>
      <stop offset="1" stop-color="#1c1318"/>
    </linearGradient>
  </defs>

  <!-- 背景 -->
  <rect width="800" height="600" fill="url(#wall)"/>
  <rect y="500" width="800" height="100" fill="#f7b6cc"/>
  <g fill="#fff" opacity=".55">
    <circle cx="80" cy="80" r="6"/><circle cx="160" cy="140" r="4"/>
    <circle cx="700" cy="70" r="6"/><circle cx="640" cy="150" r="4"/>
    <circle cx="740" cy="220" r="5"/><circle cx="60" cy="240" r="5"/>
  </g>
  <g fill="#ffd65c">
    <path class="sparkle" d="M110 190 l6 14 14 6 -14 6 -6 14 -6 -14 -14 -6 14 -6z"/>
    <path class="sparkle" style="animation-delay:.7s" d="M690 280 l5 11 11 5 -11 5 -5 11 -5 -11 -11 -5 11 -5z"/>
    <path class="sparkle" style="animation-delay:1.3s" d="M620 60 l4 9 9 4 -9 4 -4 9 -4 -9 -9 -4 9 -4z"/>
  </g>
  <text x="400" y="52" text-anchor="middle" font-size="30" font-weight="700" fill="#d94f7c">♪ Kitty 弹钢琴 ♪</text>

  <!-- 尾巴 -->
  <g class="tail">
    <path d="M470 372 C 530 360, 540 300, 580 290" fill="none" stroke="#222" stroke-width="22" stroke-linecap="round"/>
    <path d="M470 372 C 530 360, 540 300, 580 290" fill="none" stroke="#fff" stroke-width="15" stroke-linecap="round"/>
  </g>

  <!-- 身体（裙子） -->
  <g class="body">
    <path d="M330 300 Q 400 280 470 300 L 500 400 L 300 400 Z" fill="#ff8fb3" stroke="#222" stroke-width="4" stroke-linejoin="round"/>
    <path d="M360 298 Q 400 322 440 298" fill="#fff" stroke="#222" stroke-width="3"/>
    <circle cx="400" cy="340" r="6" fill="#ffd65c" stroke="#222" stroke-width="2"/>
    <circle cx="400" cy="365" r="6" fill="#ffd65c" stroke="#222" stroke-width="2"/>
  </g>

  <!-- 钢琴 -->
  <g id="piano">
    <rect x="165" y="372" width="470" height="22" rx="6" fill="url(#lacquer)"/>
    <rect x="165" y="470" width="470" height="80" rx="8" fill="url(#lacquer)"/>
    <rect x="185" y="560" width="18" height="30" fill="#1c1318"/>
    <rect x="597" y="560" width="18" height="30" fill="#1c1318"/>
    <rect x="175" y="548" width="450" height="14" rx="4" fill="#2b1f26"/>
    <text x="400" y="520" text-anchor="middle" font-size="20" fill="#e8c46a" font-style="italic">♫ Kitty Grand ♫</text>
    <rect x="178" y="388" width="444" height="86" fill="#1c1318"/>
    <g id="whiteKeys"></g>
    <g id="blackKeys"></g>
  </g>

  <!-- 手臂和爪子（由 JS 更新位置） -->
  <g id="arms">
    <line id="armL-o" x1="350" y1="325" x2="300" y2="420" stroke="#222" stroke-width="30" stroke-linecap="round"/>
    <line id="armR-o" x1="450" y1="325" x2="500" y2="420" stroke="#222" stroke-width="30" stroke-linecap="round"/>
    <line id="armL" x1="350" y1="325" x2="300" y2="420" stroke="#fff" stroke-width="22" stroke-linecap="round"/>
    <line id="armR" x1="450" y1="325" x2="500" y2="420" stroke="#fff" stroke-width="22" stroke-linecap="round"/>
    <g id="pawL">
      <ellipse rx="17" ry="13" fill="#fff" stroke="#222" stroke-width="4"/>
      <path d="M-5 4 v7 M5 4 v7" stroke="#222" stroke-width="2" stroke-linecap="round"/>
    </g>
    <g id="pawR">
      <ellipse rx="17" ry="13" fill="#fff" stroke="#222" stroke-width="4"/>
      <path d="M-5 4 v7 M5 4 v7" stroke="#222" stroke-width="2" stroke-linecap="round"/>
    </g>
  </g>

  <!-- 头 -->
  <g class="head">
    <path d="M305 175 L 318 92 L 378 140 Z" fill="#fff" stroke="#222" stroke-width="4" stroke-linejoin="round"/>
    <path d="M422 140 L 482 92 L 495 175 Z" fill="#fff" stroke="#222" stroke-width="4" stroke-linejoin="round"/>
    <ellipse cx="400" cy="220" rx="115" ry="88" fill="#fff" stroke="#222" stroke-width="4"/>

    <!-- 蝴蝶结 -->
    <g class="bow">
      <path d="M470 132 C 430 95, 420 150, 452 162 Z" fill="#e8304a" stroke="#222" stroke-width="4" stroke-linejoin="round"/>
      <path d="M470 132 C 510 95, 530 150, 490 162 Z" fill="#e8304a" stroke="#222" stroke-width="4" stroke-linejoin="round" transform="rotate(-20 470 132)"/>
      <circle cx="470" cy="136" r="13" fill="#e8304a" stroke="#222" stroke-width="4"/>
      <circle cx="466" cy="132" r="3" fill="#fff" opacity=".7"/>
    </g>

    <!-- 脸 -->
    <ellipse class="eye" cx="355" cy="228" rx="9" ry="13" fill="#222"/>
    <ellipse class="eye" cx="445" cy="228" rx="9" ry="13" fill="#222"/>
    <ellipse cx="400" cy="252" rx="10" ry="7" fill="#ffd65c" stroke="#222" stroke-width="3"/>
    <ellipse cx="335" cy="258" rx="14" ry="7" fill="#ffb3c8" opacity=".6"/>
    <ellipse cx="465" cy="258" rx="14" ry="7" fill="#ffb3c8" opacity=".6"/>
    <g stroke="#222" stroke-width="4" stroke-linecap="round">
      <line x1="315" y1="232" x2="275" y2="222"/>
      <line x1="313" y1="248" x2="270" y2="250"/>
      <line x1="315" y1="264" x2="276" y2="278"/>
      <line x1="485" y1="232" x2="525" y2="222"/>
      <line x1="487" y1="248" x2="530" y2="250"/>
      <line x1="485" y1="264" x2="524" y2="278"/>
    </g>
  </g>

  <g id="notes"></g>
</svg>

<button id="soundBtn" type="button">🔊 开启声音</button>

<script>
(() => {
  const NS = 'http://www.w3.org/2000/svg';
  const KEY_X0 = 190, KEY_W = 28, KEY_Y = 390, WHITE_COUNT = 15; // C4 ~ C6
  const NAMES = ['C', 'D', 'E', 'F', 'G', 'A', 'B'];
  const SEMI = [0, 2, 4, 5, 7, 9, 11];
  const BEAT = 0.45; // 秒

  // 生成琴键
  const whiteG = document.getElementById('whiteKeys');
  const blackG = document.getElementById('blackKeys');
  const whiteKeys = [];
  for (let i = 0; i < WHITE_COUNT; i++) {
    const r = document.createElementNS(NS, 'rect');
    r.setAttribute('x', KEY_X0 + i * KEY_W);
    r.setAttribute('y', KEY_Y);
    r.setAttribute('width', KEY_W - 2);
    r.setAttribute('height', 80);
    r.setAttribute('rx', 3);
    r.setAttribute('fill', '#fffaf5');
    r.style.transition = 'fill .15s, transform .08s';
    whiteG.appendChild(r);
    whiteKeys.push(r);
    if ([0, 1, 3, 4, 5].includes(i % 7) && i < WHITE_COUNT - 1) {
      const b = document.createElementNS(NS, 'rect');
      b.setAttribute('x', KEY_X0 + (i + 1) * KEY_W - 10);
      b.setAttribute('y', KEY_Y);
      b.setAttribute('width', 18);
      b.setAttribute('height', 48);
      b.setAttribute('rx', 2);
      b.setAttribute('fill', '#1c1318');
      blackG.appendChild(b);
    }
  }

  const keyIndex = name => NAMES.indexOf(name[0]) + (parseInt(name.slice(1), 10) - 4) * 7;
  const keyX = i => KEY_X0 + i * KEY_W + KEY_W / 2 - 1;
  const midi = i => 60 + Math.floor(i / 7) * 12 + SEMI[i % 7];

  // 小星星（右爪旋律）+ 左爪伴奏
  const melody = ('C5 C5 G5 G5 A5 A5 G5:2 F5 F5 E5 E5 D5 D5 C5:2 ' +
                  'G5 G5 F5 F5 E5 E5 D5:2 G5 G5 F5 F5 E5 E5 D5:2 ' +
                  'C5 C5 G5 G5 A5 A5 G5:2 F5 F5 E5 E5 D5 D5 C5:2').split(' ');
  const bass = 'C4 C4 F4 C4 F4 C4 G4 C4 C4 F4 C4 G4 C4 F4 C4 G4 C4 C4 F4 C4 F4 C4 G4 C4'.split(' ');

  const events = [];
  let t = 0;
  for (const m of melody) {
    const [n, d] = m.split(':');
    const beats = d ? +d : 1;
    events.push({ time: t, key: keyIndex(n), hand: 'R', dur: beats * BEAT });
    t += beats;
  }
  bass.forEach((n, i) => events.push({ time: i * 2, key: keyIndex(n), hand: 'L', dur: 2 * BEAT }));
  const LOOP = t + 2; // 每轮之间停顿 2 拍
  events.sort((a, b) => a.time - b.time);

  // 爪子状态
  const hands = {
    L: { shoulder: [352, 325], x: keyX(2), tx: keyX(2), press: 0,
         paw: document.getElementById('pawL'), arm: ['armL', 'armL-o'].map(id => document.getElementById(id)) },
    R: { shoulder: [448, 325], x: keyX(9), tx: keyX(9), press: 0,
         paw: document.getElementById('pawR'), arm: ['armR', 'armR-o'].map(id => document.getElementById(id)) },
  };

  // 声音
  let audio = null;
  const btn = document.getElementById('soundBtn');
  btn.addEventListener('click', () => {
    if (!audio) {
      audio = new (window.AudioContext || window.webkitAudioContext)();
      btn.textContent = '🔇 关闭声音';
    } else if (audio.state === 'running') {
      audio.suspend(); btn.textContent = '🔊 开启声音';
    } else {
      audio.resume(); btn.textContent = '🔇 关闭声音';
    }
  });
  function playTone(m, dur, vol) {
    if (!audio || audio.state !== 'running') return;
    const now = audio.currentTime;
    const osc = audio.createOscillator();
    const osc2 = audio.createOscillator();
    const g = audio.createGain();
    osc.type = 'triangle';
    osc2.type = 'sine';
    osc.frequency.value = 440 * Math.pow(2, (m - 69) / 12);
    osc2.frequency.value = osc.frequency.value * 2;
    g.gain.setValueAtTime(0, now);
    g.gain.linearRampToValueAtTime(vol, now + 0.01);
    g.gain.exponentialRampToValueAtTime(0.001, now + dur + 0.4);
    osc.connect(g); osc2.connect(g); g.connect(audio.destination);
    osc.start(now); osc2.start(now);
    osc.stop(now + dur + 0.5); osc2.stop(now + dur + 0.5);
  }

  // 飘出的音符
  const notesG = document.getElementById('notes');
  const GLYPHS = ['♪', '♫', '♩', '♬'];
  const COLORS = ['#ff6f9c', '#e8304a', '#9b6bff', '#3fb6ff', '#ffb000'];
  function spawnNote(x) {
    const el = document.createElementNS(NS, 'text');
    el.textContent = GLYPHS[Math.random() * GLYPHS.length | 0];
    el.setAttribute('x', x);
    el.setAttribute('y', 370);
    el.setAttribute('font-size', 26 + Math.random() * 12);
    el.setAttribute('text-anchor', 'middle');
    el.setAttribute('fill', COLORS[Math.random() * COLORS.length | 0]);
    el.setAttribute('class', 'note');
    el.style.transformBox = 'fill-box';
    el.style.transformOrigin = 'center';
    el.style.setProperty('--dx', ((x - 400) * 0.6 + (Math.random() - 0.5) * 80) + 'px');
    el.style.setProperty('--rot', ((Math.random() - 0.5) * 50) + 'deg');
    notesG.appendChild(el);
    el.addEventListener('animationend', () => el.remove());
  }

  function hit(ev) {
    const h = hands[ev.hand];
    h.tx = keyX(ev.key);
    h.press = 1;
    const k = whiteKeys[ev.key];
    k.setAttribute('fill', ev.hand === 'R' ? '#ffc2d6' : '#cfe6ff');
    k.style.transform = 'translateY(3px)';
    setTimeout(() => { k.setAttribute('fill', '#fffaf5'); k.style.transform = ''; }, Math.min(ev.dur * 1000 - 40, 380));
    playTone(midi(ev.key), ev.dur, ev.hand === 'R' ? 0.18 : 0.12);
    if (ev.hand === 'R' || Math.random() < 0.5) spawnNote(h.tx);
  }

  function drawHand(h) {
    const dx = h.tx - h.x;
    h.x += dx * 0.45;
    h.press *= 0.82;
    const lift = Math.min(Math.abs(dx) / KEY_W, 1) * 14;
    const x = h.x, y = 418 + h.press * 8 - lift;
    h.paw.setAttribute('transform', `translate(${x.toFixed(1)} ${y.toFixed(1)})`);
    for (const a of h.arm) {
      a.setAttribute('x1', h.shoulder[0]);
      a.setAttribute('y1', h.shoulder[1]);
      a.setAttribute('x2', x.toFixed(1));
      a.setAttribute('y2', (y - 6).toFixed(1));
    }
  }

  let start = null, loopIdx = -1, next = 0;
  function frame(ts) {
    if (start === null) start = ts;
    const beat = (ts - start) / 1000 / BEAT;
    const loop = Math.floor(beat / LOOP);
    if (loop !== loopIdx) { loopIdx = loop; next = 0; }
    const local = beat - loop * LOOP;
    while (next < events.length && events[next].time <= local) hit(events[next++]);
    drawHand(hands.L);
    drawHand(hands.R);
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
