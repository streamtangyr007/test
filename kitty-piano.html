<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kitty 弹钢琴</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 14px;
    padding: 16px;
    background: #140b1f;
    font-family: "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
  }
  svg {
    width: min(100%, 900px, calc((100vh - 100px) * 4 / 3));
    height: auto;
    display: block;
    border-radius: 16px;
    box-shadow: 0 10px 40px rgba(0, 0, 0, .5);
  }
  button {
    border: none;
    border-radius: 999px;
    padding: 10px 24px;
    font-size: 16px;
    color: #fff;
    background: #ff6f9c;
    cursor: pointer;
    box-shadow: 0 4px 0 #c94676;
  }
  button:active { transform: translateY(2px); box-shadow: 0 2px 0 #c94676; }

  .eye { transform-box: fill-box; transform-origin: center; animation: blink 3.6s infinite; }
  @keyframes blink { 0%, 93%, 100% { transform: scaleY(1); } 96% { transform: scaleY(.1); } }

  .bow { transform-origin: 478px 116px; animation: wiggle .45s ease-in-out infinite alternate; }
  @keyframes wiggle { from { transform: rotate(-4deg); } to { transform: rotate(4deg); } }

  .tail { transform-origin: 466px 372px; animation: swish 1.8s ease-in-out infinite alternate; }
  @keyframes swish { from { transform: rotate(-14deg); } to { transform: rotate(8deg); } }

  .star { transform-box: fill-box; transform-origin: center; animation: twinkle 2.4s ease-in-out infinite; }
  @keyframes twinkle { 0%, 100% { opacity: .15; transform: scale(.5); } 50% { opacity: 1; transform: scale(1); } }

  .rise { animation: rise 2.6s ease-out forwards; }
  @keyframes rise {
    0%   { opacity: 0; transform: translate(0, 0) scale(.4); }
    12%  { opacity: 1; transform: translate(0, -20px) scale(1); }
    100% { opacity: 0; transform: translate(var(--dx), -230px) scale(1.15); }
  }
  .sway { animation: sway .8s ease-in-out infinite alternate; }
  @keyframes sway { from { transform: translateX(-8px) rotate(-12deg); } to { transform: translateX(8px) rotate(12deg); } }

  .pop { transform-box: fill-box; transform-origin: center; animation: pop .5s ease-out forwards; }
  @keyframes pop { from { opacity: .9; transform: scale(.5); } to { opacity: 0; transform: scale(2.2); } }

  @media (prefers-reduced-motion: reduce) {
    .eye, .bow, .tail, .star, .sway { animation: none; }
  }
</style>
</head>
<body>

<svg id="stage" viewBox="0 0 800 600" role="img" aria-label="戴红色蝴蝶结的白色小猫在舞台上弹钢琴的动画">
  <defs>
    <linearGradient id="wall" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2b1846"/>
      <stop offset="1" stop-color="#4b2466"/>
    </linearGradient>
    <linearGradient id="wood" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8a5634"/>
      <stop offset="1" stop-color="#5b331f"/>
    </linearGradient>
    <linearGradient id="beam" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff6d8" stop-opacity=".32"/>
      <stop offset="1" stop-color="#fff6d8" stop-opacity=".06"/>
    </linearGradient>
    <radialGradient id="pool">
      <stop offset="0" stop-color="#ffe9a8" stop-opacity=".55"/>
      <stop offset="1" stop-color="#ffe9a8" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="folds" x1="0" y1="0" x2="36" y2="0" gradientUnits="userSpaceOnUse" spreadMethod="repeat">
      <stop offset="0" stop-color="#7d0d22"/>
      <stop offset=".5" stop-color="#d42a44"/>
      <stop offset="1" stop-color="#7d0d22"/>
    </linearGradient>
    <linearGradient id="caseGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ff9cc0"/>
      <stop offset="1" stop-color="#e0578a"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffe08a"/>
      <stop offset="1" stop-color="#d49a2a"/>
    </linearGradient>

    <!-- 音符形状 -->
    <g id="n1">
      <ellipse cx="0" cy="0" rx="9" ry="7" transform="rotate(-20)"/>
      <rect x="6" y="-36" width="3.5" height="36"/>
      <path d="M9.5 -36 q 15 6 12 24 q -3 -11 -12 -13 z"/>
    </g>
    <g id="n2">
      <ellipse cx="0" cy="0" rx="9" ry="7" transform="rotate(-20)"/>
      <ellipse cx="26" cy="-6" rx="9" ry="7" transform="rotate(-20 26 -6)"/>
      <rect x="6" y="-36" width="3.5" height="36"/>
      <rect x="32" y="-42" width="3.5" height="36"/>
      <path d="M6 -36 L35.5 -42 L35.5 -34 L6 -28 Z"/>
    </g>
  </defs>

  <!-- 舞台背景 -->
  <rect width="800" height="600" fill="url(#wall)"/>
  <g fill="#fff">
    <circle class="star" cx="120" cy="120" r="2.5"/>
    <circle class="star" cx="230" cy="80" r="2" style="animation-delay:.6s"/>
    <circle class="star" cx="610" cy="100" r="2.5" style="animation-delay:1.1s"/>
    <circle class="star" cx="680" cy="190" r="2" style="animation-delay:1.7s"/>
    <circle class="star" cx="200" cy="230" r="2" style="animation-delay:.3s"/>
    <circle class="star" cx="585" cy="250" r="2" style="animation-delay:1.4s"/>
  </g>
  <rect y="450" width="800" height="150" fill="url(#wood)"/>
  <g id="planks" stroke="#3a1f12" stroke-opacity=".35" stroke-width="2"></g>
  <rect y="450" width="800" height="4" fill="#3a1f12" opacity=".5"/>

  <!-- 聚光灯 -->
  <polygon points="345,0 455,0 660,590 140,590" fill="url(#beam)"/>
  <ellipse cx="400" cy="575" rx="300" ry="40" fill="url(#pool)"/>

  <!-- 尾巴 -->
  <g class="tail">
    <path d="M466 372 C 510 378, 540 350, 545 318 C 548 300, 566 296, 570 312" fill="none" stroke="#3b2a2a" stroke-width="21" stroke-linecap="round"/>
    <path d="M466 372 C 510 378, 540 350, 545 318 C 548 300, 566 296, 570 312" fill="none" stroke="#fff" stroke-width="13" stroke-linecap="round"/>
  </g>

  <!-- 身体：黄衬衫 + 蓝背带裤 -->
  <g id="body">
    <path d="M335 340 Q 332 302 368 298 L 432 298 Q 468 302 465 340 L 475 400 L 325 400 Z" fill="#ffd34d" stroke="#3b2a2a" stroke-width="4" stroke-linejoin="round"/>
    <path d="M358 338 L 442 338 L 450 400 L 350 400 Z" fill="#3a78d4" stroke="#3b2a2a" stroke-width="4" stroke-linejoin="round"/>
    <path d="M362 340 L 354 304 M438 340 L 446 304" stroke="#3a78d4" stroke-width="11" stroke-linecap="round"/>
    <circle cx="362" cy="346" r="5" fill="#ffd34d" stroke="#3b2a2a" stroke-width="2"/>
    <circle cx="438" cy="346" r="5" fill="#ffd34d" stroke="#3b2a2a" stroke-width="2"/>
    <rect x="384" y="354" width="32" height="22" rx="4" fill="#5b93e4" stroke="#3b2a2a" stroke-width="2"/>
    <path d="M400 371 l -7 -7 a 4 4 0 0 1 7 -4 a 4 4 0 0 1 7 4 z" fill="#ff6f9c"/>
    <ellipse cx="400" cy="302" rx="72" ry="9" fill="#000" opacity=".12"/>
  </g>

  <!-- 钢琴 -->
  <g id="piano">
    <ellipse cx="400" cy="578" rx="235" ry="12" fill="#000" opacity=".35"/>
    <!-- 琴腿与踏板 -->
    <path d="M212 510 C 206 535, 222 550, 214 570 L 232 570 C 236 548, 226 530, 236 510 Z" fill="#e0578a" stroke="#3b2a2a" stroke-width="3"/>
    <path d="M588 510 C 594 535, 578 550, 586 570 L 568 570 C 564 548, 574 530, 564 510 Z" fill="#e0578a" stroke="#3b2a2a" stroke-width="3"/>
    <rect x="210" y="566" width="28" height="7" rx="3" fill="url(#gold)"/>
    <rect x="562" y="566" width="28" height="7" rx="3" fill="url(#gold)"/>
    <rect x="382" y="510" width="36" height="48" rx="6" fill="#e0578a" stroke="#3b2a2a" stroke-width="3"/>
    <rect x="378" y="556" width="12" height="6" rx="2" fill="url(#gold)"/>
    <rect x="394" y="556" width="12" height="6" rx="2" fill="url(#gold)"/>
    <rect x="410" y="556" width="12" height="6" rx="2" fill="url(#gold)"/>
    <!-- 琴身 -->
    <rect x="195" y="446" width="410" height="70" rx="14" fill="url(#caseGrad)" stroke="#3b2a2a" stroke-width="4"/>
    <rect x="210" y="456" width="380" height="50" rx="9" fill="none" stroke="url(#gold)" stroke-width="3"/>
    <path d="M400 496 l -13 -13 a 7.5 7.5 0 0 1 13 -8 a 7.5 7.5 0 0 1 13 8 z" fill="url(#gold)"/>
    <path d="M395 486 v-12 l8 -2" stroke="#e0578a" stroke-width="2.5" fill="none" stroke-linecap="round"/>
    <!-- 琴盖挡板与侧板 -->
    <rect x="203" y="380" width="394" height="20" rx="5" fill="url(#caseGrad)" stroke="#3b2a2a" stroke-width="4"/>
    <line x1="215" y1="391" x2="585" y2="391" stroke="url(#gold)" stroke-width="2"/>
    <rect x="203" y="396" width="394" height="44" fill="#3b2a2a"/>
    <g id="whiteKeys"></g>
    <g id="blackKeys"></g>
    <rect x="203" y="378" width="28" height="68" rx="7" fill="url(#caseGrad)" stroke="#3b2a2a" stroke-width="4"/>
    <rect x="569" y="378" width="28" height="68" rx="7" fill="url(#caseGrad)" stroke="#3b2a2a" stroke-width="4"/>
    <rect x="200" y="437" width="400" height="13" rx="4" fill="#e0578a" stroke="#3b2a2a" stroke-width="4"/>
  </g>
  <g id="pops"></g>

  <!-- 手臂（JS 驱动） -->
  <g id="arms" fill="none" stroke-linecap="round">
    <path id="armL-o" stroke="#3b2a2a" stroke-width="30"/>
    <path id="armR-o" stroke="#3b2a2a" stroke-width="30"/>
    <path id="armL" stroke="#fff" stroke-width="22"/>
    <path id="armR" stroke="#fff" stroke-width="22"/>
    <circle id="pawL" r="14" fill="#fff" stroke="#3b2a2a" stroke-width="4"/>
    <circle id="pawR" r="14" fill="#fff" stroke="#3b2a2a" stroke-width="4"/>
    <circle id="sleeveL" r="17" fill="#ffd34d" stroke="#3b2a2a" stroke-width="4"/>
    <circle id="sleeveR" r="17" fill="#ffd34d" stroke="#3b2a2a" stroke-width="4"/>
  </g>

  <!-- 头 -->
  <g id="head">
    <path d="M290 170 C 282 120, 290 88, 305 84 C 322 82, 345 100, 362 122 Z" fill="#fff" stroke="#3b2a2a" stroke-width="4.5" stroke-linejoin="round"/>
    <path d="M510 170 C 518 120, 510 88, 495 84 C 478 82, 455 100, 438 122 Z" fill="#fff" stroke="#3b2a2a" stroke-width="4.5" stroke-linejoin="round"/>
    <ellipse cx="400" cy="205" rx="125" ry="95" fill="#fff" stroke="#3b2a2a" stroke-width="4.5"/>

    <g class="bow">
      <path d="M478 115 C 452 75, 410 90, 425 125 C 432 142, 460 140, 478 115 Z" fill="#e8304a" stroke="#3b2a2a" stroke-width="4" stroke-linejoin="round"/>
      <path d="M478 115 C 500 72, 548 80, 540 118 C 535 140, 500 140, 478 115 Z" fill="#e8304a" stroke="#3b2a2a" stroke-width="4" stroke-linejoin="round"/>
      <ellipse cx="440" cy="106" rx="7" ry="4" fill="#fff" opacity=".45" transform="rotate(-30 440 106)"/>
      <ellipse cx="518" cy="100" rx="7" ry="4" fill="#fff" opacity=".45" transform="rotate(20 518 100)"/>
      <ellipse cx="478" cy="116" rx="15" ry="14" fill="#e8304a" stroke="#3b2a2a" stroke-width="4"/>
    </g>

    <g id="eyesOpen" fill="#3b2a2a">
      <ellipse class="eye" cx="343" cy="212" rx="9" ry="12.5"/>
      <ellipse class="eye" cx="457" cy="212" rx="9" ry="12.5"/>
    </g>
    <g id="eyesHappy" fill="none" stroke="#3b2a2a" stroke-width="4.5" stroke-linecap="round" display="none">
      <path d="M333 216 Q 343 202 353 216"/>
      <path d="M447 216 Q 457 202 467 216"/>
    </g>
    <ellipse cx="400" cy="238" rx="12" ry="8" fill="#ffd34d" stroke="#3b2a2a" stroke-width="3.5"/>
    <ellipse cx="322" cy="244" rx="15" ry="8" fill="#ff9ab8" opacity=".55"/>
    <ellipse cx="478" cy="244" rx="15" ry="8" fill="#ff9ab8" opacity=".55"/>
    <g stroke="#3b2a2a" stroke-width="4.5" stroke-linecap="round">
      <line x1="302" y1="200" x2="248" y2="188"/>
      <line x1="298" y1="220" x2="242" y2="222"/>
      <line x1="302" y1="240" x2="250" y2="256"/>
      <line x1="498" y1="200" x2="552" y2="188"/>
      <line x1="502" y1="220" x2="558" y2="222"/>
      <line x1="498" y1="240" x2="550" y2="256"/>
    </g>
  </g>

  <g id="notes"></g>

  <!-- 幕布 -->
  <path d="M0 0 H170 C 160 150, 130 260, 70 320 C 100 380, 110 480, 95 600 H0 Z" fill="url(#folds)"/>
  <path d="M800 0 H630 C 640 150, 670 260, 730 320 C 700 380, 690 480, 705 600 H800 Z" fill="url(#folds)"/>
  <ellipse cx="80" cy="318" rx="18" ry="9" fill="url(#gold)"/>
  <ellipse cx="720" cy="318" rx="18" ry="9" fill="url(#gold)"/>
  <path d="M0 0 H800 V36 Q750 62 700 36 Q650 62 600 36 Q550 62 500 36 Q450 62 400 36 Q350 62 300 36 Q250 62 200 36 Q150 62 100 36 Q50 62 0 36 Z" fill="#b3192f"/>
  <path d="M0 36 Q50 62 100 36 Q150 62 200 36 Q250 62 300 36 Q350 62 400 36 Q450 62 500 36 Q550 62 600 36 Q650 62 700 36 Q750 62 800 36" fill="none" stroke="url(#gold)" stroke-width="4"/>
  <text x="400" y="27" text-anchor="middle" font-size="21" font-weight="700" fill="#ffe08a" letter-spacing="2">♪ Kitty 钢琴演奏会 ♪</text>
</svg>

<button id="soundBtn" type="button">🔊 开启声音</button>

<script>
(() => {
  const NS = 'http://www.w3.org/2000/svg';
  const $ = id => document.getElementById(id);
  const KEY_X0 = 231, KEY_W = 24.14, KEY_TOP = 398, WHITE_COUNT = 14; // C4 ~ B5
  const NAMES = ['C', 'D', 'E', 'F', 'G', 'A', 'B'];
  const SEMI = [0, 2, 4, 5, 7, 9, 11];
  const BEAT = 0.42; // 秒/拍

  // 地板木纹
  const planks = $('planks');
  for (let k = -9; k <= 9; k++) {
    const l = document.createElementNS(NS, 'line');
    l.setAttribute('x1', 400 + k * 42); l.setAttribute('y1', 454);
    l.setAttribute('x2', 400 + k * 95); l.setAttribute('y2', 600);
    planks.appendChild(l);
  }

  // 琴键（顶面 + 正面，带一点立体感）
  const whiteKeys = [];
  for (let i = 0; i < WHITE_COUNT; i++) {
    const x = KEY_X0 + i * KEY_W;
    const g = document.createElementNS(NS, 'g');
    const top = document.createElementNS(NS, 'rect');
    top.setAttribute('x', x + 1); top.setAttribute('y', KEY_TOP);
    top.setAttribute('width', KEY_W - 2); top.setAttribute('height', 30); top.setAttribute('rx', 2);
    top.setAttribute('fill', '#fffdf8'); top.setAttribute('stroke', '#d9cfc4');
    const front = document.createElementNS(NS, 'rect');
    front.setAttribute('x', x + 1); front.setAttribute('y', KEY_TOP + 30);
    front.setAttribute('width', KEY_W - 2); front.setAttribute('height', 8); front.setAttribute('rx', 1.5);
    front.setAttribute('fill', '#e6dbcf');
    g.append(top, front);
    $('whiteKeys').appendChild(g);
    whiteKeys.push({ g, top });
    if ([0, 1, 3, 4, 5].includes(i % 7) && i < WHITE_COUNT - 1) {
      const bx = KEY_X0 + (i + 1) * KEY_W - 7;
      const bt = document.createElementNS(NS, 'rect');
      bt.setAttribute('x', bx); bt.setAttribute('y', KEY_TOP);
      bt.setAttribute('width', 14); bt.setAttribute('height', 18); bt.setAttribute('rx', 2);
      bt.setAttribute('fill', '#2d2428');
      const bf = document.createElementNS(NS, 'rect');
      bf.setAttribute('x', bx); bf.setAttribute('y', KEY_TOP + 18);
      bf.setAttribute('width', 14); bf.setAttribute('height', 5); bf.setAttribute('rx', 1.5);
      bf.setAttribute('fill', '#120d10');
      $('blackKeys').append(bt, bf);
    }
  }

  const keyIndex = name => NAMES.indexOf(name[0]) + (parseInt(name.slice(1), 10) - 4) * 7;
  const keyX = i => KEY_X0 + i * KEY_W + KEY_W / 2;
  const midi = i => 60 + Math.floor(i / 7) * 12 + SEMI[i % 7];

  // 乐曲：《小星星》——右爪旋律，左爪分解和弦
  const melody = ('C5 C5 G5 G5 A5 A5 G5:2 F5 F5 E5 E5 D5 D5 C5:2 ' +
                  'G5 G5 F5 F5 E5 E5 D5:2 G5 G5 F5 F5 E5 E5 D5:2 ' +
                  'C5 C5 G5 G5 A5 A5 G5:2 F5 F5 E5 E5 D5 D5 C5:2').split(' ');
  const chords = 'C C F C F C G C C F C G C F C G C C F C F C G C'.split(' ');
  const PATTERN = { C: ['C4', 'G4'], F: ['F4', 'A4'], G: ['D4', 'G4'] };

  const events = [];
  let t = 0;
  for (const m of melody) {
    const [n, d] = m.split(':');
    const beats = d ? +d : 1;
    events.push({ time: t, key: keyIndex(n), hand: 'R', beats });
    t += beats;
  }
  chords.forEach((c, i) => PATTERN[c].forEach((n, j) =>
    events.push({ time: i * 2 + j, key: keyIndex(n), hand: 'L', beats: 1 })));
  const LOOP = t + 2;
  events.sort((a, b) => a.time - b.time);

  // 手
  const hands = {
    L: { sx: 348, sy: 318, dir: -1, x: keyX(2), tx: keyX(2), press: 0,
         paw: $('pawL'), sleeve: $('sleeveL'), arm: [$('armL'), $('armL-o')] },
    R: { sx: 452, sy: 318, dir: 1, x: keyX(9), tx: keyX(9), press: 0,
         paw: $('pawR'), sleeve: $('sleeveR'), arm: [$('armR'), $('armR-o')] },
  };

  // 声音（点击按钮后开启）
  let audio = null, master = null;
  const btn = $('soundBtn');
  btn.addEventListener('click', () => {
    if (!audio) {
      audio = new (window.AudioContext || window.webkitAudioContext)();
      master = audio.createGain();
      master.gain.value = 0.7;
      master.connect(audio.destination);
      btn.textContent = '🔇 关闭声音';
    } else if (audio.state === 'running') {
      audio.suspend(); btn.textContent = '🔊 开启声音';
    } else {
      audio.resume(); btn.textContent = '🔇 关闭声音';
    }
  });
  function playTone(m, dur, vol) {
    if (!audio || audio.state !== 'running') return;
    const now = audio.currentTime;
    const f = 440 * Math.pow(2, (m - 69) / 12);
    const g = audio.createGain();
    g.gain.setValueAtTime(0.0001, now);
    g.gain.exponentialRampToValueAtTime(vol, now + 0.006);
    g.gain.exponentialRampToValueAtTime(vol * 0.35, now + 0.25);
    g.gain.exponentialRampToValueAtTime(0.0001, now + dur + 0.9);
    g.connect(master);
    [[1, 1], [2, 0.35], [3, 0.12], [4, 0.05]].forEach(([h, a]) => {
      const o = audio.createOscillator();
      const og = audio.createGain();
      o.type = 'sine';
      o.frequency.value = f * h;
      og.gain.value = a;
      o.connect(og); og.connect(g);
      o.start(now); o.stop(now + dur + 1);
    });
  }

  // 音符 & 光圈
  const COLORS = ['#ffd166', '#ff8fb3', '#7fdcff', '#c9a7ff', '#9dffb0'];
  function spawnNote(x, y, dir) {
    const pos = document.createElementNS(NS, 'g');
    pos.setAttribute('transform', `translate(${x} ${y})`);
    const rise = document.createElementNS(NS, 'g');
    rise.setAttribute('class', 'rise');
    rise.style.setProperty('--dx', (dir * (80 + Math.random() * 100)) + 'px');
    const sway = document.createElementNS(NS, 'g');
    sway.setAttribute('class', 'sway');
    sway.style.animationDelay = (-Math.random()) + 's';
    const use = document.createElementNS(NS, 'use');
    use.setAttribute('href', Math.random() < 0.6 ? '#n1' : '#n2');
    use.setAttribute('fill', COLORS[Math.random() * COLORS.length | 0]);
    sway.appendChild(use); rise.appendChild(sway); pos.appendChild(rise);
    $('notes').appendChild(pos);
    rise.addEventListener('animationend', () => pos.remove());
  }
  function spawnPop(x, color) {
    const e = document.createElementNS(NS, 'ellipse');
    e.setAttribute('cx', x); e.setAttribute('cy', KEY_TOP + 16);
    e.setAttribute('rx', 14); e.setAttribute('ry', 9);
    e.setAttribute('fill', color); e.setAttribute('class', 'pop');
    $('pops').appendChild(e);
    e.addEventListener('animationend', () => e.remove());
  }

  let happyUntil = 0;
  function hit(ev, now) {
    const h = hands[ev.hand];
    h.tx = keyX(ev.key);
    h.press = 1;
    const k = whiteKeys[ev.key];
    const color = ev.hand === 'R' ? '#ffc2d6' : '#cfe3ff';
    k.top.setAttribute('fill', color);
    k.g.setAttribute('transform', 'translate(0 2.5)');
    setTimeout(() => { k.top.setAttribute('fill', '#fffdf8'); k.g.removeAttribute('transform'); },
               Math.min(ev.beats * BEAT * 1000 - 40, 320));
    spawnPop(h.tx, ev.hand === 'R' ? '#ff8fb3' : '#7fdcff');
    playTone(midi(ev.key), ev.beats * BEAT, ev.hand === 'R' ? 0.22 : 0.13);
    if (ev.hand === 'R' || Math.random() < 0.4) spawnNote(h.tx, 380, h.dir);
    if (ev.hand === 'R' && ev.beats >= 2) happyUntil = now + ev.beats * BEAT * 1000;
  }

  function drawHand(h, bodyY) {
    const dx = h.tx - h.x;
    h.x += dx * 0.4;
    h.press *= 0.8;
    const lift = Math.min(Math.abs(dx) / KEY_W, 1) * 16;
    const px = h.x, py = 409 + h.press * 5 - lift;
    const sy = h.sy + bodyY;
    const cx = (h.dir < 0 ? Math.min(h.sx, px) : Math.max(h.sx, px)) + h.dir * 24;
    const cy = (sy + py) / 2 + 6;
    const d = `M${h.sx} ${sy.toFixed(1)} Q ${cx.toFixed(1)} ${cy.toFixed(1)} ${px.toFixed(1)} ${(py - 4).toFixed(1)}`;
    for (const a of h.arm) a.setAttribute('d', d);
    h.paw.setAttribute('cx', px.toFixed(1));
    h.paw.setAttribute('cy', py.toFixed(1));
    h.sleeve.setAttribute('cx', h.sx);
    h.sleeve.setAttribute('cy', sy.toFixed(1));
  }

  const head = $('head'), body = $('body');
  const eyesOpen = $('eyesOpen'), eyesHappy = $('eyesHappy');
  let start = null, loopIdx = -1, next = 0;
  function frame(ts) {
    if (start === null) start = ts;
    const beat = (ts - start) / 1000 / BEAT;
    const loop = Math.floor(beat / LOOP);
    if (loop !== loopIdx) { loopIdx = loop; next = 0; }
    const local = beat - loop * LOOP;
    while (next < events.length && events[next].time <= local) hit(events[next++], ts);

    // 跟着节拍摇头晃脑
    const bounce = Math.abs(Math.sin(Math.PI * beat));
    const angle = 4 * Math.sin(Math.PI * beat / 2);
    head.setAttribute('transform', `translate(0 ${(-4 * bounce).toFixed(2)}) rotate(${angle.toFixed(2)} 400 295)`);
    const bodyY = -1.5 * bounce;
    body.setAttribute('transform', `translate(0 ${bodyY.toFixed(2)})`);

    const happy = ts < happyUntil;
    eyesOpen.setAttribute('display', happy ? 'none' : 'inline');
    eyesHappy.setAttribute('display', happy ? 'inline' : 'none');

    drawHand(hands.L, bodyY);
    drawHand(hands.R, bodyY);
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
})();
</script>
